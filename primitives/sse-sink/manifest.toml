# SSE Sink Primitive Manifest
#
# The release tag supplies the version and the release's checksums.txt supplies
# the archive checksums, so neither is written here. `cargo run -p xtask --
# generate` stamps both into the index and manifests attached to the release.

[primitive]
name = "sse-sink"
kind = "sink"
description = "Push pipeline events to browsers via Server-Sent Events"
homepage = "https://github.com/Govcraft/emergent-primitives"
license = "MIT"
runtime = "deno"
tags = ["sse", "realtime", "browser", "dashboard", "monitoring"]

[messages]
subscribes = ["*"]

# CLI Arguments
[[args]]
name = "port"
long = "port"
short = "p"
required = false
description = "HTTP port for SSE connections (default: 8080)"

# Binary Downloads
#
# Release targets. The archive for each is
# <name>-<version>-<target>.tar.gz, built by .github/workflows/release.yml.
[binaries]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
