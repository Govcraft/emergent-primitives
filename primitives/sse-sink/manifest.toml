# SSE Sink Primitive Manifest
#
# The release tag supplies the version and the release's checksums.txt supplies
# the archive checksums, so neither is written here. `cargo run -p xtask --
# generate` stamps both into the index and manifests attached to the release.

[primitive]
name = "sse-sink"
kind = "sink"
description = "Push pipeline events to browsers via Server-Sent Events"
homepage = "https://github.com/Govcraft/emergent-primitives"
license = "MIT"
tags = ["sse", "realtime", "browser", "dashboard", "monitoring"]

[messages]
subscribes = ["*"]

# CLI Arguments
[[args]]
name = "host"
long = "host"
required = false
description = "Address to serve the SSE stream on (default: 127.0.0.1; use 0.0.0.0 to expose it on every interface)"

[[args]]
name = "port"
long = "port"
short = "p"
required = false
description = "HTTP port for SSE connections (default: 8080)"

[[args]]
name = "allow-origin"
long = "allow-origin"
required = false
description = "Browser origin allowed to read the stream, such as http://localhost:3000 (repeatable; default: none, so no page on another origin can read it; '*' allows every origin)"

[[args]]
name = "allow-host"
long = "allow-host"
required = false
description = "Host name the sink answers to besides IP addresses and localhost, such as the public name of a reverse proxy in front of it (repeatable; a request naming any other host gets 421, which is what stops DNS rebinding)"

# Binary Downloads
#
# Release targets. The archive for each is
# <name>-<version>-<target>.tar.gz, built by .github/workflows/release.yml.
[binaries]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
