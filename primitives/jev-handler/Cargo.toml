[package]
name = "jev-handler"
description = "Jev handler for Emergent - ask TypeSafe System One typed questions about event payloads"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "jev-handler"
path = "src/main.rs"

[dependencies]
clap.workspace = true
emergent-client.workspace = true
exec-common = { path = "../exec-common" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "http2", "charset", "system-proxy", "rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml = "1.1.6"
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[dev-dependencies]
axum.workspace = true
