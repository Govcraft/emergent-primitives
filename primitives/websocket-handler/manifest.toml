# WebSocket Handler Primitive Manifest
#
# The release tag supplies the version and the release's checksums.txt supplies
# the archive checksums, so neither is written here. `cargo run -p xtask --
# generate` stamps both into the index and manifests attached to the release.

[primitive]
name = "websocket-handler"
kind = "handler"
description = "Bidirectional WebSocket bridge for Emergent pipelines"
homepage = "https://github.com/Govcraft/emergent-primitives"
license = "MIT"
tags = ["websocket", "ws", "realtime", "bidirectional"]

[messages]
subscribes = ["ws.connect", "ws.send", "ws.disconnect"]
publishes = ["ws.connected", "ws.frame", "ws.closed", "ws.disconnected", "ws.error"]

# CLI Arguments
[[args]]
name = "prefix"
long = "prefix"
required = false
description = "Message type prefix (default: ws)"

# Binary Downloads
#
# Release targets. The archive for each is
# <name>-<version>-<target>.tar.gz, built by .github/workflows/release.yml.
[binaries]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
